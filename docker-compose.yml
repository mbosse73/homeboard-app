services:
  homeboard:
    image: mcr.microsoft.com/playwright:v1.61.1-noble
    container_name: homeboard
    working_dir: /app
    command: ["sh", "-c", "npm install --omit=dev --no-audit --no-fund && node server.js"]
    ports:
      - "3080:3000"
    volumes:
      - /mnt/user/appdata/homeboard:/app
    environment:
      - PORT=3000
      - HOMEBOARD_DOCKER=1
      - TZ=Europe/Berlin
    restart: unless-stopped
